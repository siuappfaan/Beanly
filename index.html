<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beanly</title>
<meta name="theme-color" content="#7A4E2D">
<meta name="description" content="Track grind size and pull time for every coffee bean">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beanly">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#3A2618;
    --roast:#7A4E2D;
    --roast-dark:#5E3A20;
    --heading:#5E3A20;
    --muted:#6B5444;
    --latte:#C9AE8C;
    --oat:#EDE3D3;
    --card:#FBF6EC;
    --row-alt:#F4ECDE;
    --line:#E2D2B8;
    --input-bg:#ffffff;
    --pull-good:#2E7D32;
    --pull-bad:#B3261E;
    --danger:#B3261E;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  :root[data-theme="dark"]{
    --espresso:#F0E6D8;
    --roast:#C08552;
    --roast-dark:#9C6B3F;
    --heading:#E0B98A;
    --muted:#B9A48D;
    --latte:#8A6B4C;
    --oat:#1E140D;
    --card:#2A1D14;
    --row-alt:#251A12;
    --line:#43321F;
    --input-bg:#332416;
    --pull-good:#7CD47F;
    --pull-bad:#FF8A80;
    --danger:#C0392B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--oat);
    color:var(--espresso);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    padding:calc(26px + env(safe-area-inset-top, 0px)) 16px calc(72px + env(safe-area-inset-bottom, 0px));
    transition:background .25s ease, color .25s ease;
  }
  button{ font-family:inherit; }
  button:active:not(:disabled){ transform:scale(.97); }
  .wrap{ max-width:600px; margin:0 auto; }

  /* ---------- header ---------- */
  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  header{ display:flex; align-items:center; gap:12px; }
  .brand-logo{
    width:34px; height:34px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid var(--line);
    background:#fff;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .history-btn{
    background:none;
    border:none;
    color:var(--heading);
    opacity:.6;
    font-size:.82rem;
    cursor:pointer;
    padding:8px 4px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .history-btn:hover{ opacity:1; }
  body[data-view="history"] .history-btn,
  body[data-view="detail"] .history-btn{ visibility:hidden; }

  /* ---------- views + transitions ---------- */
  .view{ display:none; }
  .view.active{ display:block; animation:viewIn .28s var(--ease) both; }
  .view.active.back{ animation-name:viewInBack; }
  @keyframes viewIn{ from{opacity:0; transform:translateX(18px)} to{opacity:1; transform:none} }
  @keyframes viewInBack{ from{opacity:0; transform:translateX(-18px)} to{opacity:1; transform:none} }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:none;
    border:none;
    color:var(--roast);
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    padding:4px 8px 4px 0;
    margin-bottom:10px;
  }
  .back-btn svg{ width:18px; height:18px; }
  svg.ic{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .page-title{
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    font-weight:600;
    margin:0 2px 12px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .count{
    font-family:'Source Sans 3', sans-serif;
    font-size:.74rem;
    font-weight:600;
    color:var(--muted);
  }

  /* ---------- cards + form ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px 18px;
    margin-bottom:18px;
    transition:background .25s ease, border-color .25s ease;
  }
  .card h2{
    font-family:'Fraunces', serif;
    font-size:1.08rem;
    font-weight:500;
    margin:0 0 14px;
    color:var(--heading);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .card.flush{ padding:2px 18px 6px; }
  label{ display:block; font-size:.8rem; font-weight:600; color:var(--heading); margin-bottom:5px; }
  input[type=text], input[type=number]{
    width:100%;
    font-family:inherit;
    font-size:1rem;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--input-bg);
    color:var(--espresso);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .25s ease;
  }
  input[type=text]:focus, input[type=number]:focus{
    border-color:var(--roast);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--roast) 22%, transparent);
  }
  input::placeholder{ color:var(--muted); opacity:.65; }
  .field{ margin-bottom:14px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .shake{ animation:shake .32s ease; }
  @keyframes shake{ 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  .date-line{
    font-size:.84rem;
    color:var(--muted);
    margin:0 0 12px;
  }
  .date-line b{ color:var(--heading); font-weight:600; }
  .reveal{ max-height:0; overflow:hidden; opacity:0; margin:0 -5px; padding:0 5px; transition:max-height .32s var(--ease), opacity .25s ease; }
  .reveal.open{ max-height:700px; opacity:1; }
  .grind-hint{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:.84rem;
    color:var(--heading);
    background:var(--row-alt);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:14px;
    animation:hintIn .3s var(--ease) both;
  }
  @keyframes hintIn{ from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none} }
  .grind-hint .arrow{ font-size:1.1rem; font-weight:700; line-height:1; }
  .grind-hint.good .arrow{ color:var(--pull-good); }
  .grind-hint.adjust .arrow{ color:var(--roast); }
  button.primary{
    width:100%;
    background:var(--roast);
    color:#fff;
    border:none;
    font-size:1rem;
    font-weight:600;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    margin-top:2px;
    transition:background .15s ease, transform .1s ease;
  }
  button.primary:hover{ background:var(--roast-dark); }
  .status{ font-size:.84rem; min-height:18px; margin-top:8px; color:var(--pull-bad); }
  .empty{ text-align:center; padding:26px 12px; color:var(--muted); font-size:.9rem; }
  .pull-good{ color:var(--pull-good); font-weight:600; }
  .pull-bad{ color:var(--pull-bad); font-weight:600; }

  /* ---------- beans list (swipe rows) ---------- */
  .card.list-card{ padding:18px 0 0; overflow:hidden; }
  .list-card h2{ padding:0 18px; margin-bottom:10px; }
  .beans-head, .row-content{
    display:grid;
    grid-template-columns:minmax(0,1fr) 46px 52px;
    gap:8px;
    align-items:center;
    padding-left:18px;
    padding-right:18px;
  }
  .beans-head{
    padding-bottom:7px;
    border-bottom:1px solid var(--line);
    font-size:.64rem;
    text-transform:uppercase;
    letter-spacing:.07em;
    font-weight:700;
    color:var(--heading);
    opacity:.85;
  }
  .beans-head span:nth-child(n+2){ text-align:right; }
  .bean-row{ position:relative; overflow:hidden; background:var(--card); }
  .bean-row + .bean-row{ border-top:1px solid var(--line); }
  .bean-row.enter{ animation:rowIn .36s var(--ease) both; animation-delay:calc(var(--i, 0) * 35ms); }
  @keyframes rowIn{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .bean-row.leaving{
    height:0 !important;
    opacity:0;
    border-top-width:0;
    transition:height .26s var(--ease), opacity .2s ease;
  }
  .row-actions{
    position:absolute;
    top:0; right:0; bottom:0;
    width:120px;
    display:flex;
    opacity:0;
    transition:opacity .2s ease;
  }
  .bean-row.open .row-actions, .bean-row.swiping .row-actions{ opacity:1; }
  .act{
    flex:1;
    border:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:.62rem;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .act svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .act-archive{ background:var(--roast); }
  .act-remove{ background:var(--danger); }
  .row-content{
    position:relative;
    background:var(--card);
    padding-top:11px;
    padding-bottom:11px;
    touch-action:pan-y;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    outline:none;
    transition:transform .26s var(--ease), background .15s ease;
    will-change:transform;
  }
  .bean-row.open .row-content{ transform:translateX(-120px); }
  .row-content:active{ background:var(--row-alt); }
  .row-content:focus-visible{ background:var(--row-alt); }
  .row-content.nudge{ animation:nudge 1s var(--ease) both; }
  @keyframes nudge{ 0%{transform:none} 35%{transform:translateX(-52px)} 70%{transform:translateX(-52px)} 100%{transform:none} }
  .b-name{
    font-weight:600;
    font-size:.95rem;
    line-height:1.25;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .b-meta{
    font-size:.74rem;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .b-num{ text-align:right; font-variant-numeric:tabular-nums; font-size:.92rem; }
  .arch-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:none;
    border:none;
    border-top:1px solid var(--line);
    padding:13px 18px;
    font-size:.8rem;
    font-weight:600;
    color:var(--heading);
    cursor:pointer;
  }
  .arch-toggle:active:not(:disabled){ transform:none; background:var(--row-alt); }
  .arch-toggle .chev{ width:16px; height:16px; transition:transform .3s var(--ease); }
  .arch-toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .arch-wrap{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--ease); }
  .arch-wrap.open{ grid-template-rows:1fr; }
  .arch-inner{ overflow:hidden; min-height:0; }
  .arch-wrap .b-name, .arch-wrap .b-num{ opacity:.7; }
  .list-card > .empty + .arch-toggle, .list-card > .arch-toggle:first-of-type{ border-top:1px solid var(--line); }

  /* ---------- history + detail rows ---------- */
  .hist-month{
    font-size:.64rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    font-weight:700;
    color:var(--heading);
    opacity:.85;
    padding:14px 0 5px;
  }
  .hist-row{
    display:grid;
    grid-template-columns:36px minmax(0,1fr) auto;
    gap:12px;
    align-items:center;
    padding:9px 0;
    border-top:1px solid var(--line);
    cursor:pointer;
    border-radius:6px;
    transition:background .15s ease;
  }
  .hist-month + .hist-row{ border-top:none; }
  .hist-row.static{ cursor:default; }
  .hist-row.static:active{ background:none; }
  .hist-row:active{ background:var(--row-alt); }
  .hist-row:focus-visible{ outline:2px solid var(--roast); outline-offset:-2px; }
  .hist-date{ text-align:center; line-height:1.05; }
  .hist-date b{ display:block; font-size:1.08rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .hist-date span{ font-size:.58rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .hist-name{ font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-note{ font-size:.74rem; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-right{ text-align:right; font-variant-numeric:tabular-nums; }
  .hist-pull{ font-size:.96rem; }
  .hist-grind{ font-size:.7rem; color:var(--muted); margin-top:1px; }

  .detail-name{ font-family:'Fraunces', serif; font-size:1.3rem; font-weight:600; line-height:1.2; }
  .detail-sub{ font-size:.78rem; color:var(--muted); margin-top:3px; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 8px; }
  .stat{ background:var(--row-alt); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .stat b{ display:block; font-size:1.05rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat span{ font-size:.6rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .chart{ width:100%; height:auto; display:block; margin-top:4px; }
  .ch-t{ font-size:9px; fill:var(--muted); font-family:'Source Sans 3', sans-serif; }
  .ch-line{ stroke:var(--roast); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .8s var(--ease) .1s forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .ch-dot{ stroke:var(--card); stroke-width:1.5; opacity:0; transform-box:fill-box; transform-origin:center; animation:dotIn .3s var(--ease) forwards; }
  .ch-dot.g{ fill:var(--pull-good); }
  .ch-dot.b{ fill:var(--pull-bad); }
  @keyframes dotIn{ from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)} }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    transform:translate(-50%, 24px);
    opacity:0;
    pointer-events:none;
    background:var(--espresso);
    color:var(--card);
    padding:9px 8px 9px 16px;
    border-radius:12px;
    font-size:.86rem;
    display:flex;
    align-items:center;
    gap:12px;
    width:max-content;
    max-width:calc(100% - 32px);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    transition:transform .3s var(--ease), opacity .22s ease;
    z-index:120;
  }
  .toast.show{ transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
  .toast span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toast button{ background:none; border:none; color:var(--latte); font-size:.84rem; font-weight:700; cursor:pointer; padding:6px 8px; border-radius:8px; }

  .install-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--roast);
    color:#fff;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:18px;
    font-size:.88rem;
  }
  .install-banner button{ background:#fff; color:#5E3A20; border:none; border-radius:8px; padding:7px 12px; font-weight:600; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .version-footer{ text-align:center; margin-top:6px; }
  .version-footer button{
    background:none;
    border:none;
    color:var(--heading);
    opacity:.4;
    font-size:.75rem;
    cursor:pointer;
    padding:8px;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    transition:opacity .2s ease;
  }
  .version-footer button:hover{ opacity:.75; }
  .version-footer button.holding{ opacity:.85; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
  }

  /* "What's new" panel (compact, shared design across apps) */
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; animation:fadeIn .16s ease; }
  .modal-sheet{
    background:var(--card);
    width:100%;
    max-width:340px;
    max-height:80vh;
    overflow-y:auto;
    border-radius:14px;
    padding:14px 16px;
    border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
    animation:popIn .18s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes popIn{ from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)} }
  .m-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:6px;
  }
  .m-title{
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    font-weight:600;
    color:var(--espresso);
    line-height:1.2;
  }
  .m-sub{ font-size:0.72rem; color:var(--muted); margin-top:2px; }
  .icon-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:none;
    color:var(--heading);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .icon-btn svg{
    width:16px;
    height:16px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon-btn .i-sun{ display:none; }
  :root[data-theme="dark"] .icon-btn .i-sun{ display:block; }
  :root[data-theme="dark"] .icon-btn .i-moon{ display:none; }
  .cl-entry{ padding:6px 0; border-top:1px solid var(--line); }
  .cl-entry:first-child{ border-top:none; }
  .cl-head, .cl-entry summary{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:0.78rem;
    color:var(--espresso);
  }
  .cl-entry summary{ cursor:pointer; list-style:none; }
  .cl-entry summary::-webkit-details-marker{ display:none; }
  .cl-head span, .cl-entry summary span{ font-size:0.68rem; color:var(--muted); }
  .cl-entry ul{
    margin:4px 0 0;
    padding-left:16px;
    font-size:0.76rem;
    line-height:1.35;
    color:var(--muted);
  }
  .cl-entry li{ margin-bottom:2px; }
  .m-sect{
    font-size:0.66rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    color:var(--heading);
    margin:8px 0 2px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .m-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    font-size:0.8rem;
    color:var(--espresso);
  }
  .pill{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .pill button{
    background:none;
    border:none;
    padding:5px 10px;
    font-family:inherit;
    font-size:0.74rem;
    color:var(--espresso);
    cursor:pointer;
  }
  .pill button.active{ background:var(--roast); color:#fff; font-weight:600; }
  .m-label{ font-size:0.8rem; color:var(--espresso); padding-top:6px; }
  .sheet-row{ display:flex; gap:6px; align-items:center; margin-top:5px; }
  .sheet-input{
    flex:1;
    min-width:0;
    font-family:inherit;
    font-size:0.74rem;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--input-bg);
    color:var(--espresso);
    outline:none;
  }
  .sm{
    font-family:inherit;
    font-size:0.74rem;
    font-weight:600;
    padding:6px 10px;
    border-radius:7px;
    border:1px solid var(--roast);
    background:none;
    color:var(--roast);
    cursor:pointer;
    white-space:nowrap;
  }
  .sm.solid{ background:var(--roast); color:#fff; }
  .btn-pair{ display:flex; gap:6px; }
  .m-note{ font-size:0.7rem; color:var(--muted); min-height:12px; margin-top:2px; }
</style>
</head>
<body data-view="main">
<div class="wrap">
  <div class="top-row">
    <header>
      <img src="icon-192.png" alt="Beanly logo" class="brand-logo">
      <h1>Beanly</h1>
    </header>
    <button class="history-btn" id="historyToggleBtn">History</button>
  </div>

<script>
const APP_VERSION = '1.3.0';
const CHANGELOG = [
  {
    version: '1.3.0',
    date: '2 Nov 2026',
    items: [
      'Tap a bean to see all its brews, a pull-time trend and its sweet-spot grind',
      'Swipe a bean left to archive or remove it, with Undo. Archived beans tuck away below the list',
      'Bean list now fits the screen with no sideways scrolling',
      'Cleaner History page, grouped by month',
      'Smoother page transitions, and Back works with your phone’s back gesture'
    ]
  },
  {
    version: '1.2.0',
    date: '2 Nov 2026',
    items: [
      "Compact \"What's new\" panel — hold the version number to open it",
      'Backup & Restore, so your brews can move between installs or phones',
      'Sync now merges edit by edit, so two devices never overwrite each other',
      'Sheet dates are stored as plain text so Google Sheets leaves them alone'
    ]
  },
  {
    version: '1.1.0',
    date: '23 Oct 2026',
    items: [
      'Grind finer/coarser suggestions based on your last pull for that bean',
      'Grinder direction setting (lower or higher number = finer)',
      'Light/dark mode',
      'Google Sheet sync',
      'Version and changelog panel'
    ]
  },
  {
    version: '1.0.0',
    date: '11 Sept 2026',
    items: [
      'Log a brew: bean, date, grind size, pull time, comments',
      'Beans table showing the last brew per bean',
      'Full brew history page',
      'Pull time green at 25–35s, red outside that range',
      'Installable as a PWA with offline support'
    ]
  }
];

const STORAGE_KEY = 'coffee-beans-data';
const HISTORY_KEY = 'coffee-log-history';
const REMOVED_KEY = 'beanly-removed';
const SETTINGS_KEY = 'beanly-settings';
let beans = {};
let logs = [];
let removed = {};
let settings = { theme: null, grindDirection: 'lowerFiner', sheetUrl: '', swipeHint: false };

const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const ACTION_W = 60;
const OPEN_X = -(ACTION_W * 2);

const $ = (id) => document.getElementById(id);
const beanInput = $('beanInput');
const beanOptions = $('beanOptions');
const revealSection = $('revealSection');
const todayLabel = $('todayLabel');
const grindInput = $('grindInput');
const timeInput = $('timeInput');
const commentsInput = $('commentsInput');
const saveBtn = $('saveBtn');
const statusMsg = $('statusMsg');
const historyToggleBtn = $('historyToggleBtn');
const backBtn = $('backBtn');
const detailBackBtn = $('detailBackBtn');
const mainView = $('mainView');
const historyView = $('historyView');
const detailView = $('detailView');
const beanList = $('beanList');
const archList = $('archList');
const archToggle = $('archToggle');
const archWrap = $('archWrap');
const archCount = $('archCount');
const beanCount = $('beanCount');
const emptyMsg = $('emptyMsg');
const historyList = $('historyList');
const historyEmptyMsg = $('historyEmptyMsg');
const histCount = $('histCount');
const detailNameEl = $('detailName');
const detailSub = $('detailSub');
const detailStats = $('detailStats');
const detailChart = $('detailChart');
const detailList = $('detailList');
const grindHint = $('grindHint');
const grindHintArrow = $('grindHintArrow');
const grindHintText = $('grindHintText');
const toastEl = $('toast');
const toastMsg = $('toastMsg');
const toastBtn = $('toastBtn');

const ICONS = {
  archive: '<svg viewBox="0 0 24 24"><path d="M3.5 4.5h17v4h-17z"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M10 12.5h4"/></svg>',
  unarchive: '<svg viewBox="0 0 24 24"><path d="M3.5 4.5h17v4h-17z"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M12 17v-5.5M9.5 14 12 11.5 14.5 14"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l.9 12a1 1 0 0 0 1 .9h8.2a1 1 0 0 0 1-.9L18 7"/><path d="M10 11v5M14 11v5"/></svg>'
};

// ---------- helpers ----------
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function todayStr(){
  return new Date().toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}
function isoToday(){
  return new Date().toISOString().slice(0,10);
}
function parseISO(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function shortDate(iso, fallback){
  const d = parseISO(iso);
  if(!d) return fallback || '';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, sameYear
    ? { day:'numeric', month:'short' }
    : { day:'numeric', month:'short', year:'2-digit' });
}
function monthLabel(iso){
  const d = parseISO(iso);
  return d ? d.toLocaleDateString(undefined, { month:'long', year:'numeric' }) : 'Earlier';
}
function readJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
function pullTimeClass(pt){
  if(pt == null || pt === '') return '';
  return (pt >= 25 && pt <= 35) ? 'pull-good' : 'pull-bad';
}
function sortedLogsDesc(list){
  return [...list].sort((a,b)=> ((b.date||'') + b.id).localeCompare((a.date||'') + a.id));
}
function activeNames(){
  return Object.keys(beans).filter(n => !beans[n].archived).sort(byRecent);
}
function archivedNames(){
  return Object.keys(beans).filter(n => beans[n].archived).sort(byRecent);
}
function byRecent(a, b){
  return ((beans[b].lastUsed||'').localeCompare(beans[a].lastUsed||'')) ||
         ((Number(beans[b].updated)||0) - (Number(beans[a].updated)||0));
}

// ---------- data ----------
function loadData(){
  beans = readJSON(STORAGE_KEY, {});
  logs = readJSON(HISTORY_KEY, []);
  removed = readJSON(REMOVED_KEY, {});
  renderAll();
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(beans));
    localStorage.setItem(HISTORY_KEY, JSON.stringify(logs));
    localStorage.setItem(REMOVED_KEY, JSON.stringify(removed));
  }catch(e){
    statusMsg.textContent = "Couldn't save — storage may be full.";
  }
}

// ---------- toast ----------
let toastTimer = null;
function hideToast(){
  toastEl.classList.remove('show');
}
function toast(msg, actionLabel, actionFn){
  toastMsg.textContent = msg;
  if(actionLabel){
    toastBtn.style.display = '';
    toastBtn.textContent = actionLabel;
    toastBtn.onclick = ()=>{ hideToast(); if(actionFn) actionFn(); };
  }else{
    toastBtn.style.display = 'none';
    toastBtn.onclick = null;
  }
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 5000 : 2600);
}

// ---------- render: beans list ----------
let renderedActive = null;
let openRow = null;

function beanRowHTML(name, b, archived, i, isNew){
  const n = escapeHtml(name);
  const date = shortDate(b.lastUsed, b.lastUsedDisplay);
  const meta = escapeHtml(date + (b.comments ? ' · ' + b.comments : ''));
  const pull = b.pullTime != null ? b.pullTime + 's' : '–';
  const grind = b.grindSize != null ? b.grindSize : '–';
  const archLabel = archived ? 'Restore' : 'Archive';
  return `<div class="bean-row${isNew ? ' enter' : ''}" data-name="${n}" style="--i:${Math.min(i, 8)}">
    <div class="row-actions">
      <button class="act act-archive" data-act="${archived ? 'unarchive' : 'archive'}" aria-label="${archLabel} ${n}">${archived ? ICONS.unarchive : ICONS.archive}<span>${archLabel}</span></button>
      <button class="act act-remove" data-act="remove" aria-label="Remove ${n}">${ICONS.trash}<span>Remove</span></button>
    </div>
    <div class="row-content" role="button" tabindex="0">
      <div class="b-main"><div class="b-name">${n}</div><div class="b-meta">${meta}</div></div>
      <div class="b-num">${grind}</div>
      <div class="b-num ${pullTimeClass(b.pullTime)}">${pull}</div>
    </div>
  </div>`;
}

function renderBeans(){
  const act = activeNames();
  const arch = archivedNames();
  beanCount.textContent = act.length ? String(act.length) : '';
  beanList.innerHTML = act.map((n, i) => beanRowHTML(n, beans[n], false, i, renderedActive === null || !renderedActive.has(n))).join('');
  archList.innerHTML = arch.map((n, i) => beanRowHTML(n, beans[n], true, i, false)).join('');
  renderedActive = new Set(act);

  if(!act.length){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = arch.length ? 'All your beans are archived.' : 'No beans yet — log your first brew above.';
  }else{
    emptyMsg.style.display = 'none';
  }
  archToggle.style.display = arch.length ? '' : 'none';
  archCount.textContent = arch.length ? String(arch.length) : '';
  if(!arch.length){
    archWrap.classList.remove('open');
    archToggle.setAttribute('aria-expanded', 'false');
  }
  openRow = null;
  beanList.querySelectorAll('.bean-row').forEach(attachSwipe);
  archList.querySelectorAll('.bean-row').forEach(attachSwipe);
}

function renderOptions(){
  beanOptions.innerHTML = activeNames().map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
}

// ---------- swipe rows ----------
function setOpen(row, open){
  row.classList.toggle('open', open);
  if(open) openRow = row;
  else if(openRow === row) openRow = null;
}

function attachSwipe(row){
  const content = row.querySelector('.row-content');
  const name = row.getAttribute('data-name');
  let startX = 0, startY = 0, baseX = 0, curX = 0, lastX = 0, lastT = 0, vx = 0;
  let pid = null, tracking = false, decided = false;

  content.addEventListener('pointerdown', (e)=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    tracking = true; decided = false; pid = e.pointerId;
    startX = lastX = e.clientX; startY = e.clientY; lastT = e.timeStamp; vx = 0;
    baseX = row.classList.contains('open') ? OPEN_X : 0;
    curX = baseX;
    row._dragged = false;
  });
  content.addEventListener('pointermove', (e)=>{
    if(!tracking || e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!decided){
      if(Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
      if(Math.abs(dy) > Math.abs(dx)){ tracking = false; return; }   // vertical scroll, not a swipe
      decided = true; row._dragged = true;
      try{ content.setPointerCapture(pid); }catch(_){}
      content.style.transition = 'none';
      row.classList.add('swiping');
      if(openRow && openRow !== row) setOpen(openRow, false);
    }
    let x = baseX + dx;
    if(x > 0) x = x * 0.2;                           // soft resistance past closed
    if(x < OPEN_X) x = OPEN_X + (x - OPEN_X) * 0.25; // soft resistance past fully open
    curX = x;
    content.style.transform = `translateX(${x}px)`;
    const dt = Math.max(1, e.timeStamp - lastT);
    vx = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = e.timeStamp;
  });
  const finish = (e)=>{
    if(!tracking || e.pointerId !== pid) return;
    tracking = false;
    if(!decided) return;
    content.style.transition = '';
    content.style.transform = '';
    row.classList.remove('swiping');
    try{ content.releasePointerCapture(pid); }catch(_){}
    const open = vx < -0.4 ? true : vx > 0.4 ? false : curX < OPEN_X / 2;
    setOpen(row, open);
  };
  content.addEventListener('pointerup', finish);
  content.addEventListener('pointercancel', finish);
  content.addEventListener('click', ()=>{
    if(row._dragged){ row._dragged = false; return; }
    if(row.classList.contains('open')){ setOpen(row, false); return; }
    openDetail(name);
  });
  content.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDetail(name); }
  });
}

document.addEventListener('pointerdown', (e)=>{
  if(openRow && !openRow.contains(e.target)) setOpen(openRow, false);
}, true);

function animateOut(row, done){
  if(reduceMotion){ done(); return; }
  row.style.height = row.offsetHeight + 'px';
  row.getBoundingClientRect();           // force layout so the height transition has a start value
  row.classList.add('leaving');
  setTimeout(done, 260);
}

function onRowAction(e){
  const btn = e.target.closest ? e.target.closest('.act') : null;
  if(!btn) return;
  const row = btn.closest('.bean-row');
  const name = row.getAttribute('data-name');
  const act = btn.getAttribute('data-act');
  animateOut(row, ()=>{
    if(act === 'remove') removeBean(name);
    else setArchived(name, act === 'archive');
  });
}
beanList.addEventListener('click', onRowAction);
archList.addEventListener('click', onRowAction);

archToggle.addEventListener('click', ()=>{
  const open = !archWrap.classList.contains('open');
  archWrap.classList.toggle('open', open);
  archToggle.setAttribute('aria-expanded', String(open));
});

function setArchived(name, flag, quiet){
  const b = beans[name];
  if(!b) return;
  beans[name] = Object.assign({}, b, { archived: flag ? 1 : 0, updated: Date.now() });
  saveData();
  renderAll();
  syncNow(false);
  if(!quiet){
    toast(`${flag ? 'Archived' : 'Restored'} ${name}`, 'Undo', ()=> setArchived(name, !flag, true));
  }
}
function removeBean(name){
  const prev = beans[name];
  if(!prev) return;
  removed[name] = Date.now();
  delete beans[name];
  saveData();
  renderAll();
  syncNow(false);
  toast(`Removed ${name}`, 'Undo', ()=>{
    beans[name] = Object.assign({}, prev, { updated: Date.now() });
    saveData();
    renderAll();
    syncNow(false);
  });
}

// ---------- render: history + detail ----------
function dateBlock(iso, fallback){
  const d = parseISO(iso);
  if(!d){
    return `<div class="hist-date"><b>–</b><span>${escapeHtml(String(fallback || '').slice(0, 6))}</span></div>`;
  }
  return `<div class="hist-date"><b>${d.getDate()}</b><span>${escapeHtml(d.toLocaleDateString(undefined, { month:'short' }))}</span></div>`;
}
function histRow(e, showName){
  const pull = e.pullTime != null ? e.pullTime + 's' : '–';
  const grind = e.grindSize != null ? e.grindSize : '–';
  const note = e.comments ? `<div class="hist-note">${escapeHtml(e.comments)}</div>` : '';
  const main = `<div class="hist-name">${showName ? escapeHtml(e.name) : 'Grind ' + escapeHtml(grind)}</div>${note}`;
  const right = `<div class="hist-pull ${pullTimeClass(e.pullTime)}">${pull}</div>` +
                (showName ? `<div class="hist-grind">grind ${escapeHtml(grind)}</div>` : '');
  return `<div class="hist-row${showName ? '' : ' static'}" data-name="${escapeHtml(e.name)}"${showName ? ' role="button" tabindex="0"' : ''}>${dateBlock(e.date, e.dateDisplay)}<div class="hist-main">${main}</div><div class="hist-right">${right}</div></div>`;
}

function renderHistory(){
  const sorted = sortedLogsDesc(logs);
  histCount.textContent = sorted.length ? `${sorted.length} brew${sorted.length === 1 ? '' : 's'}` : '';
  historyEmptyMsg.style.display = sorted.length ? 'none' : 'block';
  let html = '', lastKey = null;
  sorted.forEach(e=>{
    const key = (e.date || '').slice(0, 7);
    if(key !== lastKey){
      lastKey = key;
      html += `<div class="hist-month">${escapeHtml(monthLabel(e.date))}</div>`;
    }
    html += histRow(e, true);
  });
  historyList.innerHTML = html;
}

function beanStats(asc){
  const pulls = asc.filter(r => r.pullTime != null);
  const avg = pulls.length ? Math.round(pulls.reduce((s, r) => s + r.pullTime, 0) / pulls.length) : null;
  const tally = {};
  asc.forEach((r, i)=>{
    if(r.pullTime != null && r.pullTime >= 25 && r.pullTime <= 35 && r.grindSize != null){
      const k = String(r.grindSize);
      if(!tally[k]) tally[k] = { grind: r.grindSize, count: 0, last: 0 };
      tally[k].count++; tally[k].last = i;
    }
  });
  const best = Object.keys(tally).map(k => tally[k]).sort((a, b)=> b.count - a.count || b.last - a.last)[0] || null;
  return { count: asc.length, avg, sweet: best ? best.grind : null };
}

function chartSVG(asc){
  const pts = asc.filter(r => r.pullTime != null);
  if(!pts.length) return '<div class="empty">No pull times logged yet.</div>';
  const W = 320, H = 124, L = 28, R = 10, T = 10, B = 22;
  const vals = pts.map(p => p.pullTime);
  const lo = Math.floor(Math.min(15, Math.min.apply(null, vals) - 3) / 5) * 5;
  const hi = Math.ceil(Math.max(45, Math.max.apply(null, vals) + 3) / 5) * 5;
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const n = pts.length;
  const x = i => n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const band = `<rect x="${L}" y="${y(35).toFixed(1)}" width="${W - L - R}" height="${(y(25) - y(35)).toFixed(1)}" fill="var(--pull-good)" opacity=".13" rx="3"/>`;
  const labels = [25, 35].map(v => `<text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" class="ch-t">${v}</text>`).join('');
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.pullTime).toFixed(1)}`).join(' ');
  const line = n > 1 ? `<path d="${d}" pathLength="1" class="ch-line" fill="none"/>` : '';
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.pullTime).toFixed(1)}" r="3.4" class="ch-dot ${p.pullTime >= 25 && p.pullTime <= 35 ? 'g' : 'b'}" style="animation-delay:${Math.min(i * 25, 600) + 250}ms"/>`).join('');
  const x1 = `<text x="${L}" y="${H - 5}" class="ch-t">${escapeHtml(shortDate(pts[0].date))}</text>`;
  const x2 = n > 1 ? `<text x="${W - R}" y="${H - 5}" text-anchor="end" class="ch-t">${escapeHtml(shortDate(pts[n - 1].date))}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pull time trend, green band is 25 to 35 seconds">${band}${labels}${line}${dots}${x1}${x2}</svg>`;
}

let detailName = null;
function renderDetail(name){
  const rows = sortedLogsDesc(logs.filter(l => l.name === name));
  const asc = [...rows].reverse();
  const st = beanStats(asc);
  detailNameEl.textContent = name;
  detailSub.textContent = rows.length
    ? `Last brewed ${shortDate(rows[0].date, rows[0].dateDisplay)}${beans[name] && beans[name].archived ? ' · archived' : ''}`
    : 'No brews logged yet';
  detailStats.innerHTML =
    `<div class="stat"><b>${st.count}</b><span>Brews</span></div>` +
    `<div class="stat"><b>${st.avg != null ? st.avg + 's' : '–'}</b><span>Avg pull</span></div>` +
    `<div class="stat"><b>${st.sweet != null ? escapeHtml(st.sweet) : '–'}</b><span>Sweet spot</span></div>`;
  detailChart.innerHTML = chartSVG(asc);
  detailList.innerHTML = rows.map(e => histRow(e, false)).join('');
}

function openDetail(name){
  detailName = name;
  renderDetail(name);
  go('detail');
}
function onHistClick(e){
  const row = e.target.closest ? e.target.closest('.hist-row') : null;
  if(row && row.getAttribute('data-name') && row.parentNode !== detailList) openDetail(row.getAttribute('data-name'));
}
historyList.addEventListener('click', onHistClick);
historyList.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onHistClick(e); }
});

function renderAll(){
  renderOptions();
  renderBeans();
  renderHistory();
  if(currentView === 'detail' && detailName) renderDetail(detailName);
}

// ---------- navigation (with the phone's back gesture) ----------
let currentView = 'main';
let mainScroll = 0;
const VIEWS = { main: mainView, history: historyView, detail: detailView };

function showView(name, dir){
  if(!VIEWS[name]) name = 'main';
  if(currentView === 'main') mainScroll = window.scrollY || 0;
  Object.keys(VIEWS).forEach(k => VIEWS[k].classList.remove('active', 'back'));
  VIEWS[name].classList.add('active');
  if(dir === 'back') VIEWS[name].classList.add('back');
  currentView = name;
  document.body.setAttribute('data-view', name);
  if(openRow) setOpen(openRow, false);
  try{ window.scrollTo(0, name === 'main' ? mainScroll : 0); }catch(e){}
}
function go(name){
  try{ history.pushState({ v: name, n: detailName }, ''); }catch(e){}
  showView(name, 'fwd');
}
function goBack(){
  if(history.state && history.state.v && history.state.v !== 'main'){ history.back(); }
  else showView('main', 'back');
}
window.addEventListener('popstate', (e)=>{
  const s = e.state || { v: 'main' };
  if(s.v === 'detail' && s.n){ detailName = s.n; renderDetail(s.n); }
  showView(s.v || 'main', 'back');
});
try{ history.replaceState({ v: 'main' }, ''); }catch(e){}

historyToggleBtn.addEventListener('click', ()=> go('history'));
backBtn.addEventListener('click', goBack);
detailBackBtn.addEventListener('click', goBack);

// ---------- grind recommendation ----------
function showGrindHint(name){
  const existing = beans[name];
  if(!existing || existing.pullTime == null){
    grindHint.style.display = 'none';
    return;
  }
  const pt = existing.pullTime;
  grindHint.style.display = 'flex';
  grindHint.classList.remove('good', 'adjust');
  // restart the entrance animation
  grindHint.style.animation = 'none'; void grindHint.offsetWidth; grindHint.style.animation = '';

  if(pt >= 25 && pt <= 35){
    grindHint.classList.add('good');
    grindHintArrow.textContent = '✓';
    grindHintText.textContent = `Last pull was ${pt}s — dialed in. Same grind should work.`;
    return;
  }
  const needFiner = pt < 25;
  const lowerIsFiner = settings.grindDirection === 'lowerFiner';
  const goLower = needFiner ? lowerIsFiner : !lowerIsFiner;
  grindHint.classList.add('adjust');
  grindHintArrow.textContent = goLower ? '↓' : '↑';
  grindHintText.textContent = `Last pull was ${pt}s (${needFiner ? 'too fast' : 'too slow'}) — try ${needFiner ? 'finer' : 'coarser'}, ${goLower ? 'a lower number' : 'a higher number'}.`;
}

// ---------- log a brew ----------
beanInput.addEventListener('input', ()=>{
  const name = beanInput.value.trim();
  const hasValue = name.length > 0;
  revealSection.classList.toggle('open', hasValue);
  if(hasValue){
    todayLabel.textContent = todayStr();
    const existing = beans[name];
    if(existing){
      grindInput.value = existing.grindSize ?? '';
      timeInput.value = existing.pullTime ?? '';
      commentsInput.value = existing.comments ?? '';
    }
    showGrindHint(name);
  }else{
    grindHint.style.display = 'none';
  }
  statusMsg.textContent = '';
});

saveBtn.addEventListener('click', ()=>{
  const name = beanInput.value.trim();
  if(!name){
    statusMsg.textContent = 'Enter a bean name first.';
    beanInput.classList.remove('shake'); void beanInput.offsetWidth; beanInput.classList.add('shake');
    return;
  }
  const grind = grindInput.value;
  const time = timeInput.value;
  const entry = {
    id: Date.now().toString(36),
    name: name,
    date: isoToday(),
    dateDisplay: todayStr(),
    grindSize: grind !== '' ? Number(grind) : null,
    pullTime: time !== '' ? Number(time) : null,
    comments: commentsInput.value.trim()
  };
  beans[name] = {                         // logging a brew also un-archives the bean
    lastUsed: entry.date,
    lastUsedDisplay: entry.dateDisplay,
    grindSize: entry.grindSize,
    pullTime: entry.pullTime,
    comments: entry.comments,
    updated: Date.now()
  };
  logs.push(entry);
  saveData();
  renderAll();

  beanInput.value = '';
  grindInput.value = '';
  timeInput.value = '';
  commentsInput.value = '';
  revealSection.classList.remove('open');
  grindHint.style.display = 'none';
  statusMsg.textContent = '';
  toast(`Logged ${name}${entry.pullTime != null ? ' · ' + entry.pullTime + 's' : ''}`);
  syncNow(false);
});

// --- Merge (edit by edit, never whole-state overwrite) ---
// MERGE-START
function normBean(b){
  return Object.assign({}, b, { updated: Number(b.updated) || Date.parse(b.lastUsed) || 0 });
}
function mergeStates(a, b){
  a = a || {}; b = b || {};
  const logMap = {};
  [].concat(a.logs || [], b.logs || []).forEach(l=>{
    if(l && l.id && !logMap[l.id]) logMap[l.id] = l;
  });
  const rem = {};
  [a.removed || {}, b.removed || {}].forEach(r=>{
    Object.keys(r).forEach(n=>{
      rem[n] = Math.max(Number(rem[n]) || 0, Number(r[n]) || 0);
    });
  });
  const names = new Set([].concat(Object.keys(a.beans || {}), Object.keys(b.beans || {})));
  const out = {};
  names.forEach(n=>{
    const x = a.beans && a.beans[n] ? normBean(a.beans[n]) : null;
    const y = b.beans && b.beans[n] ? normBean(b.beans[n]) : null;
    const win = (x && y) ? (y.updated > x.updated ? y : x) : (x || y);
    const t = Number(rem[n]) || 0;
    if(!t || win.updated > t) out[n] = win;
  });
  return { beans: out, logs: Object.keys(logMap).map(k => logMap[k]), removed: rem };
}
// MERGE-END

function currentState(){
  return { beans, logs, removed };
}
function applyState(state){
  beans = state.beans;
  logs = state.logs;
  removed = state.removed;
  saveData();
  renderAll();
}

loadData();

// --- Settings (theme, grind direction, sheet sync) ---
function loadSettings(){
  settings = Object.assign(settings, readJSON(SETTINGS_KEY, {}));
  if(!settings.theme){
    settings.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme();
}
function saveSettings(){
  try{
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  }catch(e){}
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme);
}

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', ()=>{
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  saveSettings();
});

const grindDirToggle = document.getElementById('grindDirToggle');
function applyGrindDirUI(){
  grindDirToggle.querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-dir') === settings.grindDirection);
  });
}
grindDirToggle.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-dir]');
  if(!btn) return;
  settings.grindDirection = btn.getAttribute('data-dir');
  applyGrindDirUI();
  saveSettings();
  const name = beanInput.value.trim();
  if(name) showGrindHint(name);
});

// --- "What's new" panel: hold the version number to open ---
const modalBackdrop = document.getElementById('modalBackdrop');
const versionBtn = document.getElementById('versionBtn');
const sheetUrlInput = document.getElementById('sheetUrlInput');
const sheetSaveBtn = document.getElementById('sheetSaveBtn');
const sheetSyncBtn = document.getElementById('sheetSyncBtn');
const syncStatus = document.getElementById('syncStatus');
const dataStatus = document.getElementById('dataStatus');
const backupBtn = document.getElementById('backupBtn');
const restoreBtn = document.getElementById('restoreBtn');
const restoreFile = document.getElementById('restoreFile');

const HOLD_MS = 800;
let holdTimer = null;
let openedAt = 0;

function openModal(){
  openedAt = Date.now();
  document.getElementById('modalSub').textContent = 'v' + APP_VERSION + ' · ' + CHANGELOG[0].date;
  sheetUrlInput.value = settings.sheetUrl || '';
  dataStatus.textContent = '';
  applyGrindDirUI();
  modalBackdrop.classList.add('open');
}
function closeModal(){
  modalBackdrop.classList.remove('open');
}
function startHold(){
  cancelHold();
  versionBtn.classList.add('holding');
  holdTimer = setTimeout(()=>{
    holdTimer = null;
    versionBtn.classList.remove('holding');
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
    openModal();
  }, HOLD_MS);
}
function cancelHold(){
  if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  versionBtn.classList.remove('holding');
}
versionBtn.textContent = 'v' + APP_VERSION;
versionBtn.addEventListener('pointerdown', startHold);
['pointerup','pointerleave','pointercancel'].forEach(ev=> versionBtn.addEventListener(ev, cancelHold));
versionBtn.addEventListener('contextmenu', (e)=> e.preventDefault());
modalBackdrop.addEventListener('click', (e)=>{
  if(e.target === modalBackdrop && Date.now() - openedAt > 300) closeModal();
});

function renderChangelog(){
  const list = document.getElementById('changelogList');
  list.innerHTML = CHANGELOG.map((entry, i) => {
    const bullets = `<ul>${entry.items.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>`;
    const head = `<b>v${entry.version}</b><span>${escapeHtml(entry.date)}</span>`;
    return i === 0
      ? `<div class="cl-entry"><div class="cl-head">${head}</div>${bullets}</div>`
      : `<details class="cl-entry"><summary>${head}</summary>${bullets}</details>`;
  }).join('');
}
renderChangelog();

// --- Backup / Restore ---
function setDataStatus(msg){ dataStatus.textContent = msg; }

backupBtn.addEventListener('click', ()=>{
  const payload = {
    app: 'Beanly',
    version: APP_VERSION,
    exported: new Date().toISOString(),
    beans, logs, removed
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Beanly_backup_' + isoToday() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  setDataStatus('Backup saved to your downloads.');
});

restoreBtn.addEventListener('click', ()=> restoreFile.click());
restoreFile.addEventListener('change', async ()=>{
  const file = restoreFile.files && restoreFile.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data || (!data.logs && !data.beans)) throw new Error('not a Beanly backup');
    const before = logs.length;
    applyState(mergeStates(currentState(), {
      beans: data.beans || {},
      logs: data.logs || [],
      removed: data.removed || {}
    }));
    setDataStatus(`Restored — ${logs.length - before} new brews added.`);
    syncNow(false);
  }catch(e){
    setDataStatus("That file couldn't be read.");
  }
  restoreFile.value = '';
});

// --- Google Sheet sync (pull, merge, push) ---
let syncing = false;
let syncAgain = false;
let lastSync = 0;

function setSyncStatus(msg){
  syncStatus.textContent = msg;
}

async function syncNow(showStatus){
  if(!settings.sheetUrl) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  if(showStatus) setSyncStatus('Syncing…');
  try{
    const res = await fetch(settings.sheetUrl, { method: 'GET' });
    const remote = await res.json();
    applyState(mergeStates(currentState(), remote));
    await fetch(settings.sheetUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(currentState())
    });
    lastSync = Date.now();
    setSyncStatus('Synced ' + new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }));
  }catch(e){
    setSyncStatus("Couldn't reach the sheet — check the URL.");
  }
  syncing = false;
  if(syncAgain){ syncAgain = false; syncNow(false); }
}

sheetSaveBtn.addEventListener('click', ()=>{
  settings.sheetUrl = sheetUrlInput.value.trim();
  saveSettings();
  if(settings.sheetUrl){
    syncNow(true);
  }else{
    setSyncStatus('Sync turned off.');
  }
});
sheetSyncBtn.addEventListener('click', ()=>{
  if(!settings.sheetUrl){
    setSyncStatus('Save a sheet URL first.');
    return;
  }
  syncNow(true);
});

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && settings.sheetUrl && Date.now() - lastSync > 30000){
    syncNow(false);
  }
});

loadSettings();
if(settings.sheetUrl) syncNow(false);

// --- PWA install prompt (Android/Chrome) ---
let deferredPrompt;
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'flex';
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBanner.style.display = 'none';
});

window.addEventListener('appinstalled', ()=>{
  installBanner.style.display = 'none';
});

// --- Register service worker ---
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// ---------- one-time hint that rows can be swiped ----------
function maybeNudge(){
  if(settings.swipeHint || reduceMotion) return;
  const first = beanList.querySelector('.bean-row .row-content');
  if(!first) return;
  settings.swipeHint = true;
  saveSettings();
  setTimeout(()=>{
    first.classList.add('nudge');
    first.addEventListener('animationend', ()=> first.classList.remove('nudge'), { once: true });
  }, 900);
}
maybeNudge();
</script>
